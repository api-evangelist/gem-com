aid: gem-com
name: Gem
url: https://raw.githubusercontent.com/api-evangelist/gem-com/refs/heads/main/apis.yml
description: >-
  Gem is an AI-first recruiting platform that bundles a next-generation ATS,
  recruiting CRM, AI outbound sourcing, scheduling, talent marketing,
  application review, and talent rediscovery into a single agentic AI hiring
  system used by more than 1,200 talent acquisition teams. Gem ships a Chrome
  extension for sourcing, a public REST API (v0) documented at
  api.gem.com/v0/reference, an integrations marketplace at
  integrations.gem.com/gem covering ATS, HRIS, scheduling, assessments,
  background checks, and job distribution, plus a status page and academy.
kind: company
accessModel:
  pricing: free
  onboarding: unknown
  trial: false
  try_now: false
  public: false
  label: Free
